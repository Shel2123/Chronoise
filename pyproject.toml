[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoise"
version = "0.1.0"
description = "Synthetic noise-driven time series with controllable structure for ML benchmarks."
authors = [
    {name = "Sosedov A.T.", email = "ac.official.it@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]
readme = "README.md"

[project.scripts]
chronoise-build = "chronoise.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chronoise*"]
